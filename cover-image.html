<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 675px;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f3460 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  position: relative;
}
.grid-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    linear-gradient(rgba(233, 69, 96, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(233, 69, 96, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}
.content {
  text-align: center;
  z-index: 1;
  padding: 40px;
}
.logo {
  font-size: 64px;
  font-weight: 800;
  color: #e94560;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.tagline {
  font-size: 24px;
  color: #e2e8f0;
  font-weight: 400;
  margin-bottom: 40px;
  max-width: 700px;
  line-height: 1.4;
}
.stats {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-bottom: 40px;
}
.stat {
  text-align: center;
}
.stat-value {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
}
.stat-label {
  font-size: 13px;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}
.services {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 800px;
}
.service-badge {
  background: rgba(233, 69, 96, 0.1);
  border: 1px solid rgba(233, 69, 96, 0.3);
  color: #e94560;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.corner-badge {
  position: absolute;
  top: 30px;
  right: 30px;
  background: #e94560;
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
}
.bottom-text {
  position: absolute;
  bottom: 30px;
  color: #64748b;
  font-size: 14px;
}
.bottom-text a {
  color: #94a3b8;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="corner-badge">$0.21/month</div>
<div class="content">
  <div class="logo">CloudSentry</div>
  <div class="tagline">Zero-cost AWS account security watchdog that scores your infrastructure like a credit score</div>
  <div class="stats">
    <div class="stat"><div class="stat-value">0-100</div><div class="stat-label">Security Score</div></div>
    <div class="stat"><div class="stat-value">10+</div><div class="stat-label">Services Scanned</div></div>
    <div class="stat"><div class="stat-value">All</div><div class="stat-label">Regions</div></div>
    <div class="stat"><div class="stat-value">1 cmd</div><div class="stat-label">Deploy/Destroy</div></div>
  </div>
  <div class="services">
    <span class="service-badge">Lambda</span>
    <span class="service-badge">EventBridge</span>
    <span class="service-badge">DynamoDB</span>
    <span class="service-badge">S3</span>
    <span class="service-badge">CloudFront</span>
    <span class="service-badge">SES</span>
    <span class="service-badge">Cost Explorer</span>
    <span class="service-badge">IAM</span>
    <span class="service-badge">Terraform</span>
  </div>
</div>
<div class="bottom-text">github.com/durrello/cloudsentry</div>
</body>
</html>
